name: Build Desktop Releases (macOS DMG & Windows installer)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/stamp_version.py

      - name: Install dependencies
        run: |
          brew install ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywebview

      - name: Build macOS DMG
        run: |
          chmod +x package_dmg.sh
          ./package_dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MusicStudio-macOS-DMG
          path: dist/MusicStudio-Installer.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/stamp_version.py

      - name: Install FFmpeg and NSIS
        run: choco install ffmpeg nsis -y

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywebview

      # Everything (Python, packages, FFmpeg, UI) is inside this one exe: nothing is installed on first run
      - name: Build standalone MusicStudio.exe
        run: pyinstaller --clean -y windows_app.spec

      - name: Build installer
        run: |
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" installer\MusicStudio_Installer.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: MusicStudio-Windows
          path: |
            dist/MusicStudio-Setup.exe
            dist/MusicStudio.exe

  publish:
    # On a version tag, attach the finished builds to the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/MusicStudio-macOS-DMG/MusicStudio-Installer.dmg
            artifacts/MusicStudio-Windows/MusicStudio-Setup.exe
            artifacts/MusicStudio-Windows/MusicStudio.exe
